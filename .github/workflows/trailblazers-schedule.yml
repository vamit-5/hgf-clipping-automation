name: Trailblazers - Automatski raspored (10x dnevno)

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 25
    outputs:
      should_publish: ${{ steps.build_step.outputs.should_publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Python
        run: python --version

      - name: Install ffmpeg
        run: ffmpeg -version

      - name: Verify Node.js
        run: node --version

      - name: Install Remotion dependencies
        working-directory: remotion/trailblazers
        run: npm install

      - name: Install Python deps
        run: pip install requests google-auth google-auth-httplib2 google-api-python-client httplib2 opencv-python-headless==4.10.0.84

      - name: Build reel (does not publish)
        id: build_step
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GDRIVE_CREDENTIALS_JSON: ${{ secrets.GDRIVE_CREDENTIALS_JSON }}
        run: python trailblazers_schedule.py

      - name: Upload build output as artifact
        if: steps.build_step.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trailblazers-build-output
          path: output_clips_schedule/
          retention-days: 3

  publish:
    needs: build
    if: needs.build.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install requests

      - name: Download build output artifact
        uses: actions/download-artifact@v4
        with:
          name: trailblazers-build-output
          path: output_clips_schedule/

      - name: Configure git for state commits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish to Instagram (runs on GitHub cloud IP)
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python trailblazers_schedule_publish.py
