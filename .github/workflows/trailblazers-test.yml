name: Trailblazers Ann Miura-Ko - test klip (dry-run)

on:
  workflow_dispatch: {}

jobs:
  build-test-clips:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: pip install requests

      - name: Run test clip generation
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python trailblazers_test.py

      - name: Upload result clips as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trailblazers-test-clips
          path: |
            output_clips/
            transcript_debug.json
            hooks_debug.json
          retention-days: 7
